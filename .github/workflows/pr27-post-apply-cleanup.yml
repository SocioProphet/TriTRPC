name: pr27 post-apply cleanup

on:
  push:
    branches:
      - hotfix/pr27-conflict-cleanup-20260414
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-scaffolding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/pr27-conflict-cleanup-20260414

      - name: Remove temporary helper files
        run: |
          git rm -f .github/workflows/pr27-conflict-cleanup.yml || true
          git rm -f .github/workflows/pr27-post-apply-cleanup.yml || true
          git rm -f tools/apply_pr27_conflict_cleanup.sh || true

      - name: Commit and push if scaffolding changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(tritrpc): remove temporary PR #27 repair scaffolding"
            git push
          else
            echo "No cleanup changes detected"
          fi
