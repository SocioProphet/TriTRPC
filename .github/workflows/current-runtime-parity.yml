name: current runtime parity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  current-runtime-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install --upgrade pip pynacl cryptography
      - name: Existing repository verification
        run: make verify
      - name: Current runtime static parity audit
        run: python tools/audit_current_runtime_static.py
